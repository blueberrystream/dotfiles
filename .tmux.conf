unbind C-b
set -g prefix C-a

set -sg escape-time 1
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm*:RGB"
set -g history-limit 1000000
set -g mouse on
set -g automatic-rename off
set -g allow-rename off

set -g window-status-activity-style bold

# Reload
unbind r
bind r source-file ~/.tmux.conf\; display "Reloaded!"

# Split Window Settings
# (Like VI keybinds)
bind s split-window -v
bind v split-window -h
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind < resize-pane -L 10
bind > resize-pane -R 10
bind - resize-pane -D 3
bind + resize-pane -U 3
bind : command-prompt

# VI-styled copy mode
setw -g mode-keys vi

# Next, Prev
unbind " "
bind " " next-window
unbind n
bind n next-window
unbind p
bind p previous-window
unbind BSpace
bind BSpace previous-window

# Last window
unbind C-a
bind C-a run "tmux last-window || tmux new-window"

# Window list
unbind a
bind a choose-window

# Title change
unbind t
bind t command-prompt "rename-window %%"

# Create and Kill
unbind N
bind N new-window
unbind K
bind K confirm-before "kill-window"

# Sync panes
unbind M-s
bind M-s set-window-option synchronize-panes on\; display "Sync panes!"
unbind M-S
bind M-S set-window-option synchronize-panes off\; display "Unsync panes!"

# Related lemonade
#unbind -T copy-mode-vi y
#bind -T copy-mode-vi y send-keys -X copy-pipe 'lemonade copy'

# for tmux plugin manager
source-file ~/.tmux.conf.d/tpm

# load local config file
source-file ~/.tmux.conf.d/local
